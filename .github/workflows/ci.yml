name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # pnpm via Corepack (no pnpm/action-setup — often blocked under restricted Actions policies).
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep (guardrails)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Guardrails
        run: pnpm guardrails

      - name: Prettier
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      # Public WPGraphQL origin (matches apps/web next.config remotePatterns host). Ensures CI matches
      # deployments and satisfies NEXT_PUBLIC_WORDPRESS_API_URL when routes fetch at build time.
      - name: Build web (Next.js)
        env:
          NEXT_PUBLIC_WORDPRESS_API_URL: https://readboot.cloudaccess.host/graphql
        run: pnpm turbo run build --filter=web

      - name: Build Trappsystems (Next.js)
        env:
          NEXT_PUBLIC_WORDPRESS_API_URL: https://readboot.cloudaccess.host/graphql
        run: pnpm turbo run build --filter=@trappsystems/site

      - name: Build ReadBoot (Next.js)
        env:
          NEXT_PUBLIC_WORDPRESS_API_URL: https://readboot.cloudaccess.host/graphql
        run: pnpm turbo run build --filter=@readboot/site

      - name: Build Storybook
        run: pnpm turbo run build-storybook --filter=storybook
