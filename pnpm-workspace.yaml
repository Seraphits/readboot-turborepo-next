packages:
  - "apps/*"
  - "packages/*"

# Single-version policy for Storybook + Vite to avoid virtual-module resolution loops (vite-app.js 404)
catalog:
  storybook: 10.3.0-alpha.17
  vite: 6.0.11
  "@storybook/addon-a11y": 10.3.0-alpha.17
  "@storybook/addon-docs": 10.3.0-alpha.17
  "@storybook/addon-themes": 10.3.0-alpha.17
  "@storybook/addon-vitest": 10.3.0-alpha.17
  "@storybook/react-vite": 10.3.0-alpha.17
  eslint-plugin-storybook: 10.3.0-alpha.17
